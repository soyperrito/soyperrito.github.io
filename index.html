<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3f51b5">
<script>
  (function () {
    var theme = 'light';
    try {
      var saved = localStorage.getItem('memorama_theme');
      if (saved === 'dark' || saved === 'light') theme = saved;
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#121212' : '#3f51b5');
  })();
</script>
<title>Memorama</title>
<style>
  :root {
    color-scheme: light;
    --primary: #3f51b5;
    --primary-text: #3f51b5;
    --primary-dark: #303f9f;
    --primary-soft: rgba(63,81,181,0.08);
    --on-primary: #ffffff;
    --card-back: #3f51b5;
    --card-back-hover: #303f9f;
    --on-card-back: #ffffff;
    --success: #2e7d32;
    --success-soft: #e8f5e9;
    --gold: #ef6c00;
    --bg: #eceff1;
    --surface: #ffffff;
    --surface-alt: #f5f7fa;
    --text: #212121;
    --text-dim: #757575;
    --divider: #e0e0e0;
    --focus: rgba(63,81,181,0.45);
    --scrollbar: #b0bec5;
    --radius: 8px;
    --shadow-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.20);
    --shadow-2: 0 3px 6px rgba(0,0,0,0.14), 0 3px 6px rgba(0,0,0,0.18);
    --shadow-3: 0 10px 24px rgba(0,0,0,0.18), 0 6px 8px rgba(0,0,0,0.16);
    --transition: 0.4s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --primary: #7986cb;
    --primary-text: #9fa8da;
    --primary-dark: #9fa8da;
    --primary-soft: rgba(121,134,203,0.16);
    --on-primary: #121212;
    --card-back: #3949ab;
    --card-back-hover: #4a5bc4;
    --on-card-back: #ffffff;
    --success: #81c784;
    --success-soft: #1b3320;
    --gold: #ffb74d;
    --bg: #121212;
    --surface: #1e1e1e;
    --surface-alt: #2a2a2a;
    --text: #eceff1;
    --text-dim: #b0bec5;
    --divider: #3a3a3a;
    --focus: rgba(121,134,203,0.55);
    --scrollbar: #546e7a;
    --shadow-1: 0 1px 3px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.65);
    --shadow-2: 0 3px 6px rgba(0,0,0,0.50), 0 3px 6px rgba(0,0,0,0.55);
    --shadow-3: 0 10px 24px rgba(0,0,0,0.60), 0 6px 8px rgba(0,0,0,0.50);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: Roboto, 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    user-select: none;
  }
  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(260px, 24vw, 330px);
    grid-template-areas: "main sidebar";
    align-items: stretch;
    padding: 16px;
    gap: 16px;
    overflow: hidden;
  }
  .sidebar {
    grid-area: sidebar;
    display: flex;
    flex-direction: column;
    gap: 16px;
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 16px;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-1);
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
  }
  .side-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .side-label {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  header { text-align: left; width: 100%; }
  h1 {
    font-size: clamp(1.5rem, 2.4vw, 1.9rem);
    font-weight: 500;
    letter-spacing: 0;
    color: var(--primary-text);
    margin-bottom: 2px;
  }
  .subtitle {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 1.6px;
    text-transform: uppercase;
  }
  .hud {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
  }
  .stat {
    background: var(--surface-alt);
    border-radius: var(--radius);
    padding: 10px 8px;
    text-align: center;
  }
  .stat-label {
    font-size: 0.66rem;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    font-weight: 500;
    color: var(--primary-text);
    font-variant-numeric: tabular-nums;
  }
  .stat-value.gold { color: var(--gold); }
  .difficulty {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .diff-btn {
    width: 100%;
    padding: 11px 14px;
    font-size: 0.85rem;
    font-weight: 500;
    font-family: inherit;
    letter-spacing: 0.4px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .diff-btn:hover { background: var(--primary-soft); border-color: var(--primary); }
  .diff-btn.active {
    background: var(--primary);
    color: var(--on-primary);
    border-color: var(--primary);
    box-shadow: var(--shadow-1);
  }
  .main {
    grid-area: main;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    overflow: auto;
  }
  .board-wrap {
    width: 100%;
    height: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
  }
  .board {
    display: grid;
    gap: var(--gap, 12px);
    grid-template-columns: repeat(var(--cols, 4), var(--card-size, 100px));
    grid-auto-rows: var(--card-size, 100px);
    justify-content: center;
  }
  .card {
    position: relative;
    transform-style: preserve-3d;
    transition: transform var(--transition);
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.matched { cursor: default; }
  .card.matched .face-front {
    background: var(--success-soft);
    border-color: var(--success);
    animation: matchPulse 0.45s ease-out;
  }
  @keyframes matchPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .card:not(.flipped):not(.matched):hover .face-back {
    background: var(--card-back-hover);
    box-shadow: var(--shadow-3);
  }
  .face {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* Ocultar caras de forma fiable */
  .card:not(.flipped) .face-front {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .card.flipped .face-back {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .card.matched .face-back {
    opacity: 0;
    visibility: hidden;
  }
  .face-back {
    background: var(--card-back);
    box-shadow: var(--shadow-1);
    transition: background-color 0.2s, box-shadow 0.2s;
  }
  .face-back::after {
    content: '?';
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 500;
    color: var(--on-card-back);
    opacity: 0.9;
  }
  .face-front {
    background: var(--surface-alt);
    transform: rotateY(180deg);
    border: 1px solid var(--divider);
  }
  .face-front img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .card.matched .face-front::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 3px solid var(--success);
    border-radius: inherit;
    pointer-events: none;
  }
  .message {
    display: none;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-top: auto;
  }
  .btn {
    width: 100%;
    padding: 12px 20px;
    font-size: 0.82rem;
    font-weight: 500;
    font-family: inherit;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background-color 0.2s, box-shadow 0.2s, color 0.2s, border-color 0.2s;
  }
  .btn-primary {
    color: var(--on-primary);
    background: var(--primary);
    box-shadow: var(--shadow-1);
  }
  .btn-primary:hover { background: var(--primary-dark); box-shadow: var(--shadow-2); }
  .btn-primary:active { box-shadow: var(--shadow-1); }
  .btn-secondary {
    color: var(--primary-text);
    background: var(--surface);
    border: 1px solid var(--divider);
  }
  .btn-secondary:hover { background: var(--primary-soft); border-color: var(--primary); }
  .btn:focus-visible,
  .diff-btn:focus-visible,
  .card:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(33,33,33,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .overlay-content {
    background: var(--surface);
    border-radius: 14px;
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow-3);
    transform: scale(0.94);
    transition: transform 0.25s cubic-bezier(.4,0,.2,1);
  }
  .overlay.visible .overlay-content { transform: scale(1); }
  .overlay h2 {
    font-size: 1.6rem;
    font-weight: 500;
    color: var(--primary-text);
    margin-bottom: 12px;
  }
  .overlay p { color: var(--text-dim); margin-bottom: 20px; line-height: 1.6; }
  .overlay .stat-big { font-size: 2.4rem; font-weight: 500; color: var(--gold); margin: 10px 0; }
  @media (max-width: 900px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "sidebar" "main";
      height: auto;
      min-height: 100vh;
      padding: 14px 12px 28px;
      gap: 12px;
      overflow: visible;
    }
    .sidebar {
      height: auto;
      overflow: visible;
      padding: 16px;
      gap: 12px;
    }
    header { text-align: center; }
    .hud { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .stat { padding: 8px 4px; }
    .stat-label { font-size: 0.6rem; }
    .difficulty { flex-direction: row; }
    .diff-btn { width: auto; flex: 1; padding: 10px 8px; font-size: 0.78rem; }
    .actions { flex-direction: row; margin-top: 0; }
    .btn { width: auto; flex: 1; }
    .main { overflow: visible; }
    .board-wrap { height: auto; }
    .overlay-content { padding: 28px 20px; }
  }
  @media (max-width: 640px) {
    .app { padding: 12px 10px 24px; gap: 10px; }
    .sidebar { padding: 14px 12px; }
    .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat-label { font-size: 0.62rem; }
    .difficulty { flex-direction: column; }
    .diff-btn { width: 100%; }
    .actions { flex-direction: column; }
    .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header>
      <h1>Memorama</h1>
    </header>
    <section class="side-section">
      <div class="side-label">Estadísticas</div>
      <div class="hud">
        <div class="stat"><div class="stat-label">Movimientos</div><div class="stat-value" id="moves">0</div></div>
        <div class="stat"><div class="stat-label">Pares</div><div class="stat-value" id="pairs">0 / 8</div></div>
        <div class="stat"><div class="stat-label">Tiempo</div><div class="stat-value" id="time">0:00</div></div>
        <div class="stat"><div class="stat-label">Récord</div><div class="stat-value gold" id="best">—</div></div>
      </div>
    </section>
    <section class="side-section">
      <div class="side-label">Dificultad</div>
      <div class="difficulty" id="difficulty">
        <button class="diff-btn active" data-level="easy">Fácil · 8</button>
        <button class="diff-btn" data-level="medium">Medio · 12</button>
        <button class="diff-btn" data-level="hard">Difícil · 16</button>
        <button class="diff-btn" data-level="veryhard">Muy difícil · 20</button>
        <button class="diff-btn" data-level="extreme">Extremo · 30</button>
      </div>
    </section>
    <div class="message" id="message"></div>
    <div class="actions">
      <button class="btn btn-primary" id="restart">Nueva partida</button>
      <button class="btn btn-secondary" id="soundToggle" aria-pressed="true">Sonido: activado</button>
      <button class="btn btn-secondary" id="themeToggle" aria-pressed="false">Tema: claro</button>
    </div>
  </aside>
  <main class="main">
    <div class="board-wrap"><div class="board" id="board"></div></div>
  </main>
</div>
<div class="overlay visible" id="startOverlay">
  <div class="overlay-content">
    <h2>Bienvenido</h2>
    <p>Encuentra todas las parejas de figuras<br>en el menor número de movimientos.</p>
    <button class="btn btn-primary" id="startBtn">Comenzar</button>
  </div>
</div>
<div class="overlay" id="winOverlay">
  <div class="overlay-content">
    <h2>¡Victoria!</h2>
    <div class="stat-big" id="winMoves">0</div>
    <p id="winDetails">Movimientos</p>
    <button class="btn btn-primary" id="playAgain">Jugar otra vez</button>
  </div>
</div>
<script>
(function () {
  'use strict';

  // 47 fotografías de la carpeta img/
  const IMAGES = [
    'img/001.png', 'img/002.png', 'img/003.png', 'img/004.png',
    'img/005.png', 'img/006.png', 'img/007.png', 'img/008.png',
    'img/009.png', 'img/010.png', 'img/011.png', 'img/012.png',
    'img/013.png', 'img/014.png', 'img/015.png', 'img/016.png',
    'img/017.png', 'img/018.png', 'img/019.png', 'img/020.png',
    'img/021.png', 'img/022.png', 'img/023.png', 'img/024.png',
    'img/025.png', 'img/026.png', 'img/027.png', 'img/028.png',
    'img/029.png', 'img/030.png', 'img/031.png', 'img/032.png',
    'img/033.png', 'img/034.png', 'img/035.png', 'img/036.png',
    'img/037.png', 'img/038.png', 'img/039.png', 'img/040.png',
    'img/041.png', 'img/042.png', 'img/043.png', 'img/044.png',
    'img/045.jpeg', 'img/046.jpg', 'img/047.jpg'
  ];

  const LEVELS = {
    easy:     { pairs: 8,  cols: 4 },
    medium:   { pairs: 12, cols: 4 },
    hard:     { pairs: 16, cols: 4 },
    veryhard: { pairs: 20, cols: 5 },
    extreme:  { pairs: 30, cols: 10 }
  };

  const state = {
    level: 'easy', cards: [], firstCard: null, secondCard: null,
    lock: false, moves: 0, matched: 0, totalPairs: 0,
    timer: null, seconds: 0, soundEnabled: true, gameActive: false
  };

  const els = {
    board: document.getElementById('board'),
    moves: document.getElementById('moves'),
    pairs: document.getElementById('pairs'),
    time: document.getElementById('time'),
    best: document.getElementById('best'),
    message: document.getElementById('message'),
    restart: document.getElementById('restart'),
    soundToggle: document.getElementById('soundToggle'),
    themeToggle: document.getElementById('themeToggle'),
    difficulty: document.getElementById('difficulty'),
    startOverlay: document.getElementById('startOverlay'),
    winOverlay: document.getElementById('winOverlay'),
    winMoves: document.getElementById('winMoves'),
    winDetails: document.getElementById('winDetails'),
    startBtn: document.getElementById('startBtn'),
    playAgain: document.getElementById('playAgain')
  };

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { state.soundEnabled = false; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, duration, type = 'sine', volume = 0.06) {
    if (!state.soundEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }
  const sfx = {
    flip:  () => playTone(520, 0.08, 'triangle', 0.05),
    match: () => { playTone(660, 0.1, 'sine', 0.07); setTimeout(() => playTone(990, 0.15, 'sine', 0.06), 100); },
    miss:  () => playTone(180, 0.2, 'sawtooth', 0.04),
    win:   () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'sine', 0.07), i * 120)); }
  };

  function shuffle(array) {
    const a = array.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function formatTime(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function getBestKey() { return 'memorama_pro_best_' + state.level; }
  function loadBest() {
    try { const v = localStorage.getItem(getBestKey()); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function saveBest(r) { try { localStorage.setItem(getBestKey(), JSON.stringify(r)); } catch (e) {} }
  function updateBestDisplay() {
    const best = loadBest();
    els.best.textContent = best ? best.moves + ' mov.' : '—';
  }

  const preloaded = new Map();
  function buildDeck(pairCount) {
    const limit = Math.min(pairCount, IMAGES.length);
    const picked = shuffle(IMAGES).slice(0, limit);
    const deck = [];
    preloaded.clear();
    picked.forEach(src => {
      deck.push({ uid: src, src });
      deck.push({ uid: src, src });
      const im = new Image();
      im.src = src;
      preloaded.set(src, im);
    });
    return shuffle(deck);
  }

  function createCardElement(data) {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', 'Carta oculta');
    card.dataset.uid = data.uid;
    card.dataset.src = data.src;

    const back = document.createElement('div');
    back.className = 'face face-back';
    const front = document.createElement('div');
    front.className = 'face face-front';

    card.appendChild(back);
    card.appendChild(front);

    card.addEventListener('click', () => handleCardClick(card));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleCardClick(card); }
    });
    return card;
  }

  function renderBoard() {
    const config = LEVELS[state.level];
    els.board.innerHTML = '';
    els.board.style.setProperty('--cols', config.cols);
    state.cards = buildDeck(config.pairs);
    state.totalPairs = config.pairs;
    state.matched = 0;
    state.moves = 0;
    state.firstCard = null;
    state.secondCard = null;
    state.lock = false;
    els.moves.textContent = '0';
    els.pairs.textContent = `0 / ${config.pairs}`;
    els.message.textContent = '';
    state.cards.forEach(cd => els.board.appendChild(createCardElement(cd)));
    updateBestDisplay();
    fitBoard();
  }

  /* Ajusta el tablero al espacio disponible de forma horizontal:
     elige el número de columnas que maximiza el tamaño de carta. */
  const mqWide = window.matchMedia('(min-width: 901px)');
  let fitFrame = 0;
  function fitBoard() {
    cancelAnimationFrame(fitFrame);
    fitFrame = requestAnimationFrame(applyBoardSize);
  }
  function applyBoardSize() {
    fitFrame = 0;
    const wrap = document.querySelector('.board-wrap');
    if (!wrap || !state.cards.length) return;
    const availW = wrap.clientWidth;
    if (!availW) return;
    const gap = availW < 560 ? 8 : 12;
    const total = state.cards.length;
    let cols = 4;
    let size = 0;

    if (mqWide.matches) {
      const availH = wrap.clientHeight;
      if (!availH) return;
      if (state.level === 'extreme') {
        const rows = 6;
        const c = 10;
        const s = Math.min(
          (availW - gap * (c - 1)) / c,
          (availH - gap * (rows - 1)) / rows
        );
        if (s >= 24) {
          cols = c;
          size = Math.floor(s);
        }
      } else {
        let best = null;
        for (let c = 2; c <= total; c++) {
          if (total % c !== 0) continue;
          const rows = total / c;
          const s = Math.min(
            (availW - gap * (c - 1)) / c,
            (availH - gap * (rows - 1)) / rows
          );
          if (s < 24) continue;
          if (!best || s > best.size + 0.5 ||
              (Math.abs(s - best.size) <= 0.5 && rows <= c && best.rows > best.cols)) {
            best = { size: s, cols: c, rows };
          }
        }
        if (best) { cols = best.cols; size = best.size; }
      }
    }

    if (!size) size = (availW - gap * 3) / 4;
    size = Math.max(28, Math.min(190, Math.floor(size)));
    els.board.style.setProperty('--gap', gap + 'px');
    els.board.style.setProperty('--cols', cols);
    els.board.style.setProperty('--card-size', size + 'px');
  }

  window.addEventListener('resize', fitBoard);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(fitBoard).observe(document.querySelector('.main'));
  }

  function handleCardClick(card) {
    if (!state.gameActive || state.lock) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

    // Voltear hacia adelante
    const frontEl = card.querySelector('.face-front');
    if (!frontEl.firstChild) {
      const img = document.createElement('img');
      img.src = card.dataset.src;
      img.alt = '';
      img.decoding = 'async';
      img.draggable = false;
      frontEl.appendChild(img);
    }
    card.classList.add('flipped');
    sfx.flip();

    if (!state.firstCard) { state.firstCard = card; return; }

    state.secondCard = card;
    state.moves++;
    els.moves.textContent = state.moves;
    state.lock = true;

    if (state.firstCard.dataset.uid === state.secondCard.dataset.uid) {
      setTimeout(resolveMatch, 350);
    } else {
      setTimeout(resolveMismatch, 800);
    }
  }

  function resolveMatch() {
    const a = state.firstCard, b = state.secondCard;
    a.classList.add('matched');
    b.classList.add('matched');
    a.setAttribute('aria-label', 'Carta emparejada');
    b.setAttribute('aria-label', 'Carta emparejada');
    state.matched++;
    els.pairs.textContent = `${state.matched} / ${state.totalPairs}`;
    sfx.match();
    state.firstCard = null;
    state.secondCard = null;
    state.lock = false;
    if (state.matched === state.totalPairs) setTimeout(handleWin, 500);
  }

  function resolveMismatch() {
    const a = state.firstCard, b = state.secondCard;

    // Limpiar SVG ANTES de voltear de regreso, para que no se vea nada raro
    a.querySelector('.face-front').innerHTML = '';
    b.querySelector('.face-front').innerHTML = '';

    a.classList.remove('flipped');
    b.classList.remove('flipped');
    sfx.miss();

    state.firstCard = null;
    state.secondCard = null;
    state.lock = false;
  }

  function handleWin() {
    stopTimer();
    state.gameActive = false;
    sfx.win();
    els.winMoves.textContent = state.moves;
    const best = loadBest();
    let isNewRecord = false;
    if (!best || state.moves < best.moves) {
      saveBest({ moves: state.moves, time: state.seconds });
      isNewRecord = true;
      updateBestDisplay();
    }
    const recordLine = isNewRecord ? '<br><span style="color:var(--gold)">Nuevo récord personal</span>' : '';
    els.winDetails.innerHTML =
      `movimientos<br><span style="color:var(--primary-text)">${formatTime(state.seconds)}</span> de tiempo${recordLine}`;
    els.winOverlay.classList.add('visible');
  }

  function startTimer() {
    stopTimer();
    state.seconds = 0;
    els.time.textContent = '0:00';
    state.timer = setInterval(() => {
      state.seconds++;
      els.time.textContent = formatTime(state.seconds);
    }, 1000);
  }
  function stopTimer() {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
  }

  function startGame() {
    initAudio();
    els.startOverlay.classList.remove('visible');
    els.winOverlay.classList.remove('visible');
    renderBoard();
    startTimer();
    state.gameActive = true;
  }
  function restartGame() {
    stopTimer();
    state.gameActive = false;
    renderBoard();
    startTimer();
    state.gameActive = true;
  }
  function setLevel(level) {
    if (!LEVELS[level]) return;
    state.level = level;
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.level === level);
    });
    updateBestDisplay();
  }

  els.difficulty.addEventListener('click', (e) => {
    const btn = e.target.closest('.diff-btn');
    if (!btn) return;
    setLevel(btn.dataset.level);
    if (state.gameActive) restartGame();
  });
  els.restart.addEventListener('click', () => { initAudio(); restartGame(); });
  els.startBtn.addEventListener('click', startGame);
  els.playAgain.addEventListener('click', () => {
    els.winOverlay.classList.remove('visible');
    restartGame();
  });
  els.soundToggle.addEventListener('click', () => {
    state.soundEnabled = !state.soundEnabled;
    els.soundToggle.textContent = state.soundEnabled ? 'Sonido: activado' : 'Sonido: desactivado';
    els.soundToggle.setAttribute('aria-pressed', String(state.soundEnabled));
    if (state.soundEnabled) { initAudio(); sfx.flip(); }
  });

  const THEME_KEY = 'memorama_theme';
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(theme, persist) {
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#121212' : '#3f51b5');
    els.themeToggle.textContent = theme === 'dark' ? 'Tema: oscuro' : 'Tema: claro';
    els.themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
    if (persist) { try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} }
  }
  els.themeToggle.addEventListener('click', () => {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  });
  applyTheme(currentTheme(), false);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.gameActive) stopTimer();
    else if (!document.hidden && state.gameActive && !state.timer) {
      state.timer = setInterval(() => {
        state.seconds++;
        els.time.textContent = formatTime(state.seconds);
      }, 1000);
    }
  });

  setLevel('easy');
  updateBestDisplay();
})();
</script>
</body>
</html>
